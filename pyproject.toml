[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rram-logic-die-pim-cmodel"
version = "0.1.0"
description = "Cycle/event CModel for RRAM persistent-weight storage feeding logic-die PE lines"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
rram-cmodel = "rram_cmodel.cli:main"

[tool.setuptools.packages.find]
include = ["rram_cmodel*"]
