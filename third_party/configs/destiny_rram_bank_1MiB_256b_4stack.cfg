-DesignTarget: RAM

-ProcessNode: 180

// This configuration is treated as one replicated RRAM bank macro by the
// CModel calibration script. Total CModel capacity is macro capacity times
// --replicated-banks.
-Capacity (MB): 1
-WordWidth (bit): 256

-DeviceRoadmap: HP

-LocalWireType: LocalConservative
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No

-GlobalWireType: GlobalConservative
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No

-Routing: H-tree

-MemoryCellInputFile: sample_RRAM.cell
-Temperature (K): 350

-OptimizationTarget: ReadEDP
-EnablePruning: Yes
-BufferDesignOptimization: balanced
-PrintLevel: 1

// Fine-grained partitioning uses a separate logic layer in DESTINY.
-StackedDieCount: 4
-PartitionGranularity: 1
-LocalTSVProjection: 0
-GlobalTSVProjection: 0
-TSVRedundancy: 1.0
-MonolithicStackCount: 1
